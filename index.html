<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metroden</title>
    <link rel="shortcut icon" href="https://avatars.githubusercontent.com/u/197493617?s=48&v=4" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/style.css">
    <meta property="og:title" content="Metroden">
    <meta property="og:description" content="Site officiel des services de transport de Lykoden">
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/197493617?s=48&v=4">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="./assets/img/minia.png">
    <meta name="twitter:title" content="Metroden">
    <meta name="twitter:description" content="Site officiel des services de transport de Lykoden">
    <meta name="twitter:image" content="https://avatars.githubusercontent.com/u/197493617?s=48&v=4">
    <script src="./assets/js/svg-pan-zoom.min.js"></script>
    <script src="./assets/js/hammer.min.js.js"></script>
</head>

<body>
    <main>
        <header>
            <div>
                <h1>Metroden</h1>
                <p class="subtitle">Services de transport de Lykoden</p>
            </div>
            <nav>
                <a href="./infos">Infos</a>
                <a href="./participation">Participation</a>
                <a href="./projets">Projets</a>
            </nav>
        </header>

        <div id="plan-container">
            <embed id="plan-metroden" type="image/svg+xml" alt="carte du réseau actuel"
                src="./assets/img/plan_metroden.svg" />
        </div>

    </main>
</body>

<script>

    var eventsHandler;

    eventsHandler = {
        haltEventListeners: ['touchstart', 'touchend', 'touchmove', 'touchleave', 'touchcancel']
        , init: function (options) {
            var instance = options.instance
                , initialScale = 1
                , pannedX = 0
                , pannedY = 0

            // Init Hammer
            // Listen only for pointer and touch events
            this.hammer = Hammer(options.svgElement, {
                inputClass: Hammer.SUPPORT_POINTER_EVENTS ? Hammer.PointerEventInput : Hammer.TouchInput
            })

            // Enable pinch
            this.hammer.get('pinch').set({ enable: true })

            // Handle double tap
            this.hammer.on('doubletap', function (ev) {
                instance.zoomIn()
            })

            // Handle pan
            this.hammer.on('panstart panmove', function (ev) {
                // On pan start reset panned variables
                if (ev.type === 'panstart') {
                    pannedX = 0
                    pannedY = 0
                }

                // Pan only the difference
                instance.panBy({ x: ev.deltaX - pannedX, y: ev.deltaY - pannedY })
                pannedX = ev.deltaX
                pannedY = ev.deltaY
            })

            // Handle pinch
            this.hammer.on('pinchstart pinchmove', function (ev) {
                // On pinch start remember initial zoom
                if (ev.type === 'pinchstart') {
                    initialScale = instance.getZoom()
                    instance.zoomAtPoint(initialScale * ev.scale, { x: ev.center.x, y: ev.center.y })
                }

                instance.zoomAtPoint(initialScale * ev.scale, { x: ev.center.x, y: ev.center.y })
            })

            // Prevent moving the page on some devices when panning over SVG
            options.svgElement.addEventListener('touchmove', function (e) { e.preventDefault(); });
        }

        , destroy: function () {
            this.hammer.destroy()
        }
    }

    // Variable globale pour panZoomPlan
    let panZoomPlan;

    document.getElementById('plan-metroden').addEventListener('load', function () {
        panZoomPlan = svgPanZoom(document.getElementById('plan-metroden'), {
            controlIconsEnabled: true,
            contain: true,
            center: true,
            customEventsHandler: eventsHandler
        });
    });

    // Gérer le redimensionnement de la fenêtre
    window.addEventListener('resize', function () {
        if (panZoomPlan) {
            panZoomPlan.resize();
            panZoomPlan.updateBBox();
            panZoomPlan.center();
        }
    });

    // Gérer le redimensionnement de la boite
    const resizeObserver = new ResizeObserver(function () {
        if (panZoomPlan) {
            panZoomPlan.resize();
            panZoomPlan.updateBBox();
            panZoomPlan.center();
        }
    });

    resizeObserver.observe(document.getElementById('plan-container'));
</script>

</html>
